name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [25]
        maven: [3.8.8, 3.9.16]

    name: Java ${{ matrix.java }} / Maven ${{ matrix.maven }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Maven ${{ matrix.maven }}
        uses: s4u/setup-maven-action@v1
        with:
          maven-version: ${{ matrix.maven }}

      - name: Build and test
        run: ./mvnw -B -U verify
        # If your repo does not use the Maven Wrapper, replace with:
        run: mvn -B --update-snapshots verify
