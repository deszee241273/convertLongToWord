name: Java CI with Maven
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        maven:
          - 3.8.8
          - 3.9.16
        
    name: 'Maven ${{ matrix.maven }} sample'
    steps:
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          java-version: 25
          maven-version: '${{ matrix.maven }}'
      - run: mvn -V -B package --file pom.xml
