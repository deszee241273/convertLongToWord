name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    name: Java ${{ matrix.java }} / Maven ${{ matrix.maven }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Maven
        uses: s4u/setup-maven-action@v1.21.0
        with:
          maven-version: 3.9.16

      - name: Build and test
        run: mvn -B --update-snapshots verify
